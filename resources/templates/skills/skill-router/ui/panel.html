<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>skill-router 面板</title>
    <style>
      /* 沙箱 iframe 内：只依赖系统字体与宿主透出的背景（透明），不引外链资源 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color-scheme: dark;
      }
      body {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        font: 11px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #b4b4b0;
      }
      .name {
        color: #e6e6e2;
        font-weight: 500;
      }
      .stats {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        appearance: none;
        border: 0;
        background: transparent;
        color: #6a6a6a;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        color: #e6e6e2;
      }
    </style>
  </head>
  <body>
    <span class="name">skill-router</span>
    <span class="stats" id="stats">等待本会话数据…</span>
    <button id="hide" title="隐藏面板">隐藏</button>
    <script>
      // zen 推来的会话指标：{ type: "zen:metrics", metrics: { rounds, tools, elapsedMs, tests, ... } }
      const post = (data) => parent.postMessage(data, "*");
      const formatDuration = (ms) => {
        const seconds = Math.round(ms / 1000);
        if (seconds < 60) return seconds + "s";
        const minutes = Math.floor(seconds / 60);
        return minutes < 60
          ? minutes + "m " + (seconds % 60) + "s"
          : Math.floor(minutes / 60) + "h " + (minutes % 60) + "m";
      };
      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "zen:metrics") return;
        const metrics = data.metrics;
        const parts = [];
        if (metrics.rounds) parts.push(metrics.rounds + " 轮");
        if (metrics.tools) parts.push(metrics.tools + " 次工具");
        if (metrics.elapsedMs > 0) parts.push("时长 " + formatDuration(metrics.elapsedMs));
        if (metrics.tests === "pass") parts.push("测试通过");
        if (metrics.tests === "fail") parts.push("测试失败");
        document.getElementById("stats").textContent = parts.join(" · ") || "暂无数据";
      });
      document.getElementById("hide").addEventListener("click", () => {
        post({ type: "zen:command", name: "hide" });
      });
    </script>
  </body>
</html>
